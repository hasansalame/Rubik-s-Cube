<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Rubik Cube</title>
  <style>
    :root{
      --bg0:#070a10;
      --bg1:#0b0f18;
      --stroke: rgba(255,255,255,.14);
      --glass: rgba(255,255,255,.10);
      --glass2: rgba(255,255,255,.06);
      --text: rgba(255,255,255,.92);
      --shadow: 0 18px 60px rgba(0,0,0,.45);
      --radius: 16px;
    }
    html,body{
      margin:0;height:100%;overflow:hidden;
      background:
        radial-gradient(1200px 900px at 20% 10%, rgba(110,231,255,.14), transparent 50%),
        radial-gradient(900px 700px at 80% 25%, rgba(167,139,250,.14), transparent 50%),
        radial-gradient(800px 800px at 50% 90%, rgba(255,255,255,.06), transparent 55%),
        linear-gradient(180deg,var(--bg0),var(--bg1));
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
    }
    canvas{display:block;width:100%;height:100%;}
    a{ color:inherit; text-decoration:none; }

    .topWrap{
      position:fixed;
      left:max(12px, env(safe-area-inset-left));
      right:max(12px, env(safe-area-inset-right));
      top:calc(12px + env(safe-area-inset-top));
      z-index:12;
      display:flex;
      justify-content:center;
      pointer-events:none;
    }
    .topStack{
      width:min(560px, calc(100vw - 24px));
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
      pointer-events:none;
    }
    .titleChip{
      pointer-events:auto;
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:999px;
      background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.06));
      border:1px solid rgba(255,255,255,.14);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color:var(--text);
      font-weight:900;
      letter-spacing:.2px;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .08s ease;
      max-width:100%;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .titleChip:active{ transform: translateY(1px) scale(.99); }
    .igDot{
      width:10px;height:10px;border-radius:999px;
      background:
        radial-gradient(circle at 30% 30%, rgba(110,231,255,.85), transparent 55%),
        radial-gradient(circle at 70% 70%, rgba(167,139,250,.85), transparent 55%),
        rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.18);
      box-shadow: 0 0 0 4px rgba(255,255,255,.06);
      flex:0 0 auto;
    }
    .titleText{ min-width:0; overflow:hidden; text-overflow:ellipsis; }

    .followLink{
      pointer-events:auto;
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background: rgba(0,0,0,.18);
      border:1px solid rgba(255,255,255,.12);
      color: rgba(255,255,255,.80);
      font-weight:800;
      font-size:12px;
      letter-spacing:.2px;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .08s ease;
      max-width:100%;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .followLink:active{ transform: translateY(1px) scale(.99); }
    .linkIcon{ width:14px;height:14px;opacity:.95;flex:0 0 auto; }

    .bar{
      position:fixed;
      left:max(12px, env(safe-area-inset-left));
      right:max(12px, env(safe-area-inset-right));
      bottom:calc(12px + env(safe-area-inset-bottom));
      z-index:10;
      display:flex;
      justify-content:center;
      pointer-events:none;
    }
    .panel{
      pointer-events:auto;
      width:min(560px, calc(100vw - 24px));
      padding:10px;
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
      border-radius:var(--radius);
      background:linear-gradient(180deg, var(--glass), var(--glass2));
      border:1px solid var(--stroke);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .btn{
      flex:1 1 150px;
      min-width:120px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:12px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.22);
      color:var(--text);
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .08s ease, background .15s ease, border-color .15s ease;
      font-weight:900;
      letter-spacing:.2px;
    }
    .btn:hover{ background: rgba(0,0,0,.28); border-color: rgba(255,255,255,.18); }
    .btn:active{ transform: translateY(1px) scale(.99); }
    .btn.primary{
      background: linear-gradient(180deg, rgba(110,231,255,.22), rgba(110,231,255,.10));
      border-color: rgba(110,231,255,.30);
    }
    .btn.ghost{
      background: rgba(255,255,255,.06);
      border-color: rgba(255,255,255,.12);
    }
    .btn[disabled]{ opacity:.55; cursor:not-allowed; }

    @media (max-width: 480px){
      .panel{ padding:6px 8px; gap:8px; width:min(520px, calc(100vw - 20px)); }
      .btn{ padding:10px 8px; font-size:12px; min-width:100px; }
    }
    @media (max-width: 380px){
      .btn{ padding:9px 8px; font-size:11px; min-width:92px; }
    }

    #error{
      position:fixed;
      left:max(12px, env(safe-area-inset-left));
      right:max(12px, env(safe-area-inset-right));
      bottom:calc(96px + env(safe-area-inset-bottom));
      z-index:20;
      background:rgba(255,40,40,.18);
      border:1px solid rgba(255,120,120,.45);
      color:#fff;
      padding:10px 12px;
      border-radius:14px;
      display:none;
      font-size:13px;
      line-height:1.35;
      white-space:pre-wrap;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    #solveOverlay{
      position:fixed;
      left:max(12px, env(safe-area-inset-left));
      right:max(12px, env(safe-area-inset-right));
      top:calc(92px + env(safe-area-inset-top));
      z-index:15;
      display:none;
      justify-content:center;
      pointer-events:none;
    }
    .solveCard{
      width:min(560px, calc(100vw - 24px));
      background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.06));
      border:1px solid rgba(255,255,255,.14);
      border-radius:16px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding:12px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .solveLeft{ display:flex; align-items:center; gap:12px; min-width:0; }
    .badge{ width:42px;height:42px;border-radius:14px; display:grid;place-items:center; border:1px solid rgba(255,255,255,.16); background: rgba(0,0,0,.22); box-shadow: 0 14px 30px rgba(0,0,0,.35); flex:0 0 auto; }
    .badgeInner{ width:26px;height:26px;border-radius:10px; border:1px solid rgba(255,255,255,.20); background: rgba(255,255,255,.10); }
    .solveText{ min-width:0; }
    .solveTitle{ color:var(--text); font-weight:900; letter-spacing:.2px; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .solveSub{ margin-top:2px; color: rgba(255,255,255,.75); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .solveRight{ display:flex; align-items:center; gap:10px; flex:0 0 auto; color: rgba(255,255,255,.75); font-size:12px; }
    .moveChip{ padding:8px 10px; border-radius:999px; background: rgba(0,0,0,.20); border:1px solid rgba(255,255,255,.12); color: var(--text); font-weight:900; letter-spacing:.3px; }
    .arrow{ width:18px;height:18px;opacity:.92; transform-origin:center; }
  </style>
</head>
<body>
  <div id="error"></div>

  <div class="topWrap">
    <div class="topStack">
      <a class="titleChip" href="https://www.instagram.com/hasansalame" target="_blank" rel="noopener noreferrer">
        <span class="igDot"></span>
        <span class="titleText">Rubik Cube by Hasan Salame</span>
      </a>

      <a class="followLink" href="https://hasansalame.com/social" target="_blank" rel="noopener noreferrer">
        <svg class="linkIcon" viewBox="0 0 24 24" fill="none">
          <path d="M10 13a5 5 0 0 0 7.1 0l1.4-1.4a5 5 0 0 0-7.1-7.1L10.7 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M14 11a5 5 0 0 0-7.1 0L5.5 12.4a5 5 0 0 0 7.1 7.1L13.3 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Follow me on social media
      </a>
    </div>
  </div>

  <div id="solveOverlay">
    <div class="solveCard">
      <div class="solveLeft">
        <div class="badge"><div id="faceColor" class="badgeInner"></div></div>
        <div class="solveText">
          <div id="solveTitle" class="solveTitle">Solving</div>
          <div id="solveSub" class="solveSub">Step 1 of 1</div>
        </div>
      </div>
      <div class="solveRight">
        <span id="moveChip" class="moveChip">R</span>
        <svg id="arrowIcon" class="arrow" viewBox="0 0 24 24" fill="none">
          <path d="M12 5a7 7 0 1 1-6.2 3.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M5.3 9.8 5 5.8 9 6.1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="bar">
    <div class="panel">
      <button id="scrambleBtn" class="btn primary">Scramble</button>
      <button id="resetBtn" class="btn ghost">Reset</button>
      <button id="solveBtn" class="btn ghost">Solve</button>
    </div>
  </div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script>
    (function(){
      const errorBox = document.getElementById("error");
      const btnScramble = document.getElementById("scrambleBtn");
      const btnReset = document.getElementById("resetBtn");
      const btnSolve = document.getElementById("solveBtn");

      const solveOverlay = document.getElementById("solveOverlay");
      const solveTitle = document.getElementById("solveTitle");
      const solveSub = document.getElementById("solveSub");
      const moveChip = document.getElementById("moveChip");
      const arrowIcon = document.getElementById("arrowIcon");
      const faceColor = document.getElementById("faceColor");

      function showError(msg){ errorBox.style.display="block"; errorBox.textContent = msg; }
      function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

      if (!window.THREE){
        showError("Three.js did not load. If your preview blocks unpkg.com, open the file in a browser with internet access.");
        return;
      }

      const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.setClearColor(0x0b0f14, 1);
      document.body.appendChild(renderer.domElement);
      renderer.domElement.style.touchAction = "none";

      const scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0x0b0f14, 10, 26);

      const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
      camera.position.set(7, 6, 9);
      camera.lookAt(0,0,0);

      scene.add(new THREE.AmbientLight(0xffffff, 0.62));
      const key = new THREE.DirectionalLight(0xffffff, 1.15);
      key.position.set(9, 14, 7);
      scene.add(key);
      const fill = new THREE.DirectionalLight(0xffffff, 0.35);
      fill.position.set(-10, 4, -10);
      scene.add(fill);

      const SIZE = 3;
      const GAP = 0.06;
      const CUBIE = 0.96;
      const half = (SIZE - 1) / 2;
      const cell = 1 + GAP;

      const tmpQ = new THREE.Quaternion();
      const cubeRoot = new THREE.Group();
      scene.add(cubeRoot);

      const highlightGroup = new THREE.Group();
      cubeRoot.add(highlightGroup);

      const COLORS = { U:0xffffff, D:0xffd500, F:0x00a651, B:0x0051ba, R:0xff5800, L:0xc41e3a, N:0x101114 };
      const geo = new THREE.BoxGeometry(CUBIE, CUBIE, CUBIE);
      const cubies = [];
      const cubieMeshes = [];
      const moveHistory = [];

      function faceMats(x,y,z){
        const edge = new THREE.MeshStandardMaterial({ color: COLORS.N, roughness: 0.55, metalness: 0.05 });
        const mk = (c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.45, metalness: 0.05 });
        return [
          x === 1  ? mk(COLORS.R) : edge,
          x === -1 ? mk(COLORS.L) : edge,
          y === 1  ? mk(COLORS.U) : edge,
          y === -1 ? mk(COLORS.D) : edge,
          z === 1  ? mk(COLORS.F) : edge,
          z === -1 ? mk(COLORS.B) : edge
        ];
      }
      function coordToPos(cx,cy,cz){ return new THREE.Vector3(cx*cell, cy*cell, cz*cell); }

      function buildCube(){
        cubies.length = 0;
        cubieMeshes.length = 0;
        cubeRoot.clear();
        cubeRoot.add(highlightGroup);
        moveHistory.length = 0;

        for (let ix=0; ix<SIZE; ix++){
          for (let iy=0; iy<SIZE; iy++){
            for (let iz=0; iz<SIZE; iz++){
              const cx = ix - half, cy = iy - half, cz = iz - half;
              const mesh = new THREE.Mesh(geo, faceMats(cx,cy,cz));
              mesh.position.copy(coordToPos(cx,cy,cz));
              cubeRoot.add(mesh);
              const c = { mesh, coord: new THREE.Vector3(cx,cy,cz) };
              mesh.userData.c = c;
              cubies.push(c);
              cubieMeshes.push(mesh);
            }
          }
        }
      }
      buildCube();

      function layerCubies(axis, layer){
        const eps = 0.001;
        return cubies.filter(c => Math.abs(c.coord[axis] - layer) < eps);
      }
      function makeTurnGroup(list){
        const g = new THREE.Group();
        cubeRoot.add(g);
        for (const c of list) g.attach(c.mesh);
        return g;
      }

      function clearHighlight(){
        while (highlightGroup.children.length) highlightGroup.remove(highlightGroup.children[0]);
      }
      function showLayerHighlight(axis, layer){
        clearHighlight();

        const ext = half*cell + CUBIE/2;
        const pad = 0.14;
        const slice = CUBIE + 0.20;

        let sx = 2*ext + pad, sy = 2*ext + pad, sz = 2*ext + pad;
        if (axis === "x") sx = slice;
        if (axis === "y") sy = slice;
        if (axis === "z") sz = slice;

        const boxGeo = new THREE.BoxGeometry(sx, sy, sz);
        const mat = new THREE.MeshBasicMaterial({ color: 0x6ee7ff, transparent: true, opacity: 0.12, depthWrite:false });
        const box = new THREE.Mesh(boxGeo, mat);

        const pos = new THREE.Vector3(
          axis === "x" ? layer*cell : 0,
          axis === "y" ? layer*cell : 0,
          axis === "z" ? layer*cell : 0
        );
        box.position.copy(pos);

        const edges = new THREE.EdgesGeometry(boxGeo);
        const lineMat = new THREE.LineBasicMaterial({ color: 0x6ee7ff, transparent:true, opacity: 0.55 });
        const wire = new THREE.LineSegments(edges, lineMat);
        wire.position.copy(pos);

        highlightGroup.add(box);
        highlightGroup.add(wire);
      }

      const raycaster = new THREE.Raycaster();
      const ndc = new THREE.Vector2();

      function setNDC(e){
        const rect = renderer.domElement.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width;
        const y = (e.clientY - rect.top) / rect.height;
        ndc.set(x*2 - 1, -(y*2 - 1));
      }
      function pick(e){
        setNDC(e);
        raycaster.setFromCamera(ndc, camera);
        const hits = raycaster.intersectObjects(cubieMeshes, false);
        if (!hits.length) return null;
        const h = hits[0];
        const nWorld = h.face.normal.clone().transformDirection(h.object.matrixWorld).normalize();
        return { object: h.object, point: h.point.clone(), nWorld };
      }

      function worldToScreen(v3){
        const rect = renderer.domElement.getBoundingClientRect();
        const p = v3.clone().project(camera);
        return new THREE.Vector2(
          (p.x + 1) * 0.5 * rect.width,
          (1 - (p.y + 1) * 0.5) * rect.height
        );
      }

      function rotateCoordOnce(v, axis, dir){
        let x=v.x, y=v.y, z=v.z;
        if (axis === "x"){
          const ny = -dir * z;
          const nz =  dir * y;
          y = ny; z = nz;
        } else if (axis === "y"){
          const nx =  dir * z;
          const nz = -dir * x;
          x = nx; z = nz;
        } else {
          const nx = -dir * y;
          const ny =  dir * x;
          x = nx; y = ny;
        }
        v.set(Math.round(x), Math.round(y), Math.round(z));
      }

      let busy = false;
      let autoMode = false;
      let activeTurn = null;
      let pendingRecord = null;

      function startDragTurn(axis, layer){
        const list = layerCubies(axis, layer);
        const group = makeTurnGroup(list);
        const axisVec =
          axis === "x" ? new THREE.Vector3(1,0,0) :
          axis === "y" ? new THREE.Vector3(0,1,0) :
                         new THREE.Vector3(0,0,1);
        activeTurn = { group, axis, axisVec, currentAngle: 0, movedMeshes: list.map(c => c.mesh) };
      }
      function applyTurnDelta(deltaAngle){
        if (!activeTurn) return;
        activeTurn.group.rotateOnAxis(activeTurn.axisVec, deltaAngle);
        activeTurn.currentAngle += deltaAngle;
      }
      function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }

      function animateSnapTo(targetAngle, speedFactor=1){
        if (!activeTurn) return Promise.resolve();
        busy = true;

        const start = activeTurn.currentAngle;
        const delta = targetAngle - start;

        const base = 130 + Math.min(260, Math.abs(delta) * 130);
        const duration = Math.max(60, base * speedFactor);

        const t0 = performance.now();
        return new Promise(res => {
          function step(now){
            const t = Math.min(1, (now - t0) / duration);
            const a = start + delta * easeOutCubic(t);
            const diff = a - activeTurn.currentAngle;
            applyTurnDelta(diff);
            if (t < 1) requestAnimationFrame(step);
            else res();
          }
          requestAnimationFrame(step);
        });
      }

      function finalizeWithKnownLayer(qTurns, record=true){
        if (!activeTurn) return;

        const axis = activeTurn.axis;
        const moved = activeTurn.movedMeshes.slice();

        for (const m of moved) cubeRoot.attach(m);
        activeTurn.group.removeFromParent();

        if (qTurns !== 0){
          const dir = qTurns > 0 ? 1 : -1;
          const steps = Math.abs(qTurns);

          for (const c of cubies){
            if (!moved.includes(c.mesh)) continue;
            for (let i=0; i<steps; i++) rotateCoordOnce(c.coord, axis, dir);
            c.mesh.position.copy(coordToPos(c.coord.x, c.coord.y, c.coord.z));
          }

          if (record) moveHistory.push({ axis, layer: pendingRecord ? pendingRecord.layer : 0, qTurns });
        } else {
          for (const c of cubies){
            if (!moved.includes(c.mesh)) continue;
            c.mesh.position.copy(coordToPos(c.coord.x, c.coord.y, c.coord.z));
          }
        }

        pendingRecord = null;
        activeTurn = null;
        busy = false;
      }

      function chooseBestTurnForDrag(hit, drag2D){
        const N = hit.nWorld.clone().normalize();
        const p0 = worldToScreen(hit.point);

        const axesLocal = [
          { axis:"x", axisLocal: new THREE.Vector3(1,0,0) },
          { axis:"y", axisLocal: new THREE.Vector3(0,1,0) },
          { axis:"z", axisLocal: new THREE.Vector3(0,0,1) }
        ];

        let best = null;
        const cubeQ = cubeRoot.quaternion;

        for (const c of axesLocal){
          const axisWorld = c.axisLocal.clone().applyQuaternion(cubeQ).normalize();
          const parallel = Math.abs(axisWorld.dot(N));
          if (parallel > 0.95) continue;

          const dWorld = axisWorld.clone().cross(N);
          const len = dWorld.length();
          if (len < 1e-5) continue;
          dWorld.normalize();

          const p1 = worldToScreen(hit.point.clone().add(dWorld));
          const dir2D = p1.clone().sub(p0);
          const d2 = dir2D.length();
          if (d2 < 2) continue;

          dir2D.multiplyScalar(1 / d2);
          const score = Math.abs(drag2D.dot(dir2D));

          if (!best || score > best.score){
            best = { axis: c.axis, dir2D, score };
          }
        }

        if (!best) return null;
        const cubie = hit.object.userData.c;
        const layer = cubie ? Math.round(cubie.coord[best.axis]) : 0;
        return { axis: best.axis, layer, dir2D: best.dir2D };
      }

      function moveInfo(axis, layer, qTurns){
        let face = "";
        let faceKey = "";
        let base = "";
        let clockwise = true;
        const turns = Math.abs(qTurns);

        if (axis === "x" && layer ===  1){ face="Right"; faceKey="R"; base="R"; clockwise = (qTurns < 0); }
        if (axis === "x" && layer === -1){ face="Left";  faceKey="L"; base="L"; clockwise = (qTurns > 0); }
        if (axis === "y" && layer ===  1){ face="Up";    faceKey="U"; base="U"; clockwise = (qTurns < 0); }
        if (axis === "y" && layer === -1){ face="Down";  faceKey="D"; base="D"; clockwise = (qTurns > 0); }
        if (axis === "z" && layer ===  1){ face="Front"; faceKey="F"; base="F"; clockwise = (qTurns < 0); }
        if (axis === "z" && layer === -1){ face="Back";  faceKey="B"; base="B"; clockwise = (qTurns > 0); }

        if (layer === 0){
          face = (axis === "x") ? "Middle (X)" : (axis === "y") ? "Middle (Y)" : "Middle (Z)";
          faceKey = "N";
          base = (axis === "x") ? "M" : (axis === "y") ? "E" : "S";
          clockwise = (qTurns > 0);
        }

        let notation = base;
        if (turns === 2) notation = base + "2";
        else if (turns === 1 && !clockwise) notation = base + "'";

        const desc = turns === 2 ? "180° turn" : (clockwise ? "clockwise" : "counterclockwise");

        const faceColorHex =
          faceKey === "R" ? COLORS.R :
          faceKey === "L" ? COLORS.L :
          faceKey === "U" ? COLORS.U :
          faceKey === "D" ? COLORS.D :
          faceKey === "F" ? COLORS.F :
          faceKey === "B" ? COLORS.B : 0x999999;

        return { face, notation, desc, clockwise, faceColorHex };
      }

      function showSolveOverlay(info, step, total){
        solveOverlay.style.display = "flex";
        moveChip.textContent = info.notation;
        solveTitle.textContent = info.notation + "  " + info.face;
        solveSub.textContent = "Step " + step + " of " + total + "  •  " + info.desc;
        arrowIcon.style.transform = info.clockwise ? "rotate(0deg)" : "rotate(180deg)";
        faceColor.style.background = "#" + info.faceColorHex.toString(16).padStart(6,"0");
      }
      function hideSolveOverlay(){ solveOverlay.style.display = "none"; }

      function setButtonsDisabled(v){
        btnScramble.disabled = v;
        btnReset.disabled = v;
        btnSolve.disabled = v;
      }

      async function finishManualIfAny(){
        if (!activeTurn) return;
        let q = Math.round(activeTurn.currentAngle / (Math.PI/2));
        q = Math.max(-2, Math.min(2, q));
        await animateSnapTo(q * (Math.PI/2), 0.55);
        finalizeWithKnownLayer(q, true);
      }

      async function doMove(axis, layer, qTurns, speedFactor, record, withVisualExplain, stepIndex, totalSteps){
        if (busy) return;
        busy = true;

        if (withVisualExplain){
          const info = moveInfo(axis, layer, qTurns);
          showSolveOverlay(info, stepIndex, totalSteps);
          showLayerHighlight(axis, layer);
        } else {
          hideSolveOverlay();
          clearHighlight();
        }

        pendingRecord = { axis, layer };
        startDragTurn(axis, layer);

        let q = Math.max(-2, Math.min(2, qTurns));
        const targetAngle = q * (Math.PI/2);

        await animateSnapTo(targetAngle, speedFactor);
        finalizeWithKnownLayer(q, record);

        if (withVisualExplain) await sleep(160);
      }

      function randomMove(){
        const axes = ["x","y","z"];
        const axis = axes[(Math.random()*3)|0];
        const layer = [-1,0,1][(Math.random()*3)|0];
        const qTurns = (Math.random() < 0.85) ? (Math.random() > 0.5 ? 1 : -1) : (Math.random() > 0.5 ? 2 : -2);
        return { axis, layer, qTurns };
      }

      async function scramble(n=22){
        if (autoMode) return;
        autoMode = true;
        setButtonsDisabled(true);
        hideSolveOverlay();
        clearHighlight();

        await finishManualIfAny();

        try{
          for (let i=0; i<n; i++){
            const m = randomMove();
            await doMove(m.axis, m.layer, m.qTurns, 0.80, true, false, 0, 0);
          }
        } finally {
          autoMode = false;
          setButtonsDisabled(false);
        }
      }

      async function solveWithSteps(){
        if (autoMode) return;
        if (moveHistory.length === 0) return;

        autoMode = true;
        setButtonsDisabled(true);
        await finishManualIfAny();

        try{
          const total = moveHistory.length;
          for (let i = total - 1, step = 1; i >= 0; i--, step++){
            const m = moveHistory[i];
            await doMove(m.axis, m.layer, -m.qTurns, 1.75, false, true, step, total);
          }
          moveHistory.length = 0;
          hideSolveOverlay();
          clearHighlight();
        } finally {
          autoMode = false;
          setButtonsDisabled(false);
        }
      }

      async function resetFast(){
        if (autoMode) return;

        hideSolveOverlay();
        clearHighlight();

        if (moveHistory.length === 0) return;

        autoMode = true;
        setButtonsDisabled(true);
        await finishManualIfAny();

        try{
          for (let i = moveHistory.length - 1; i >= 0; i--){
            const m = moveHistory[i];
            await doMove(m.axis, m.layer, -m.qTurns, 0.45, false, false, 0, 0);
          }
          moveHistory.length = 0;
        } finally {
          autoMode = false;
          setButtonsDisabled(false);
        }
      }

      btnScramble.addEventListener("click", () => scramble(22));
      btnSolve.addEventListener("click", solveWithSteps);
      btnReset.addEventListener("click", resetFast);

      /* Zoom and rotate cube */
      let fitScale = 1;
      let zoomFactor = 1;

      function computeFitScale(){
        const ext = half*cell + CUBIE/2;
        const r = Math.sqrt(3) * ext;

        const dist = camera.position.length();
        const vfov = THREE.MathUtils.degToRad(camera.fov);
        const hfov = 2 * Math.atan(Math.tan(vfov/2) * camera.aspect);

        const maxR = Math.min(dist * Math.sin(vfov/2), dist * Math.sin(hfov/2)) * 0.86;
        return Math.max(0.55, Math.min(1.6, maxR / r));
      }
      function applyScale(){ cubeRoot.scale.setScalar(fitScale * zoomFactor); }
      function clampZoom(){ zoomFactor = Math.max(0.55, Math.min(2.8, zoomFactor)); }
      function updateFit(){ fitScale = computeFitScale(); applyScale(); }
      updateFit();

      cubeRoot.rotation.set(0.55, 0.78, 0.15);

      renderer.domElement.addEventListener("wheel", (e) => {
        e.preventDefault();
        const mul = Math.exp(e.deltaY * 0.0012);
        zoomFactor *= mul;
        clampZoom();
        applyScale();
      }, { passive:false });

      function normalizeAngle(a){
        while (a > Math.PI) a -= Math.PI * 2;
        while (a < -Math.PI) a += Math.PI * 2;
        return a;
      }
      function getCamAxes(){
        const camDir = new THREE.Vector3();
        camera.getWorldDirection(camDir).normalize();
        const camUp = camera.up.clone().normalize();
        const camRight = new THREE.Vector3().crossVectors(camDir, camUp).normalize();
        const up = new THREE.Vector3().crossVectors(camRight, camDir).normalize();
        return { camDir, camRight, camUp: up };
      }
      function rotateCubeWorld(axisWorld, angle){
        if (angle === 0) return;
        tmpQ.setFromAxisAngle(axisWorld, angle);
        cubeRoot.quaternion.premultiply(tmpQ);
      }

      const pointers = new Map();

      const two = { active:false, lastCx:0, lastCy:0, lastDist:0, lastAng:0 };
      function dist2(a,b){ const dx=a.x-b.x, dy=a.y-b.y; return Math.hypot(dx,dy); }
      function ang2(a,b){ return Math.atan2(b.y-a.y, b.x-a.x); }

      function startTwoFinger(){
        const ids = Array.from(pointers.keys()).slice(0,2);
        const p0 = pointers.get(ids[0]);
        const p1 = pointers.get(ids[1]);
        two.active = true;
        two.lastCx = (p0.x + p1.x) * 0.5;
        two.lastCy = (p0.y + p1.y) * 0.5;
        two.lastDist = Math.max(10, dist2(p0,p1));
        two.lastAng = ang2(p0,p1);

        if (activeTurn && !busy && !autoMode){
          finishManualIfAny();
          touchState.down = false;
          touchState.decided = false;
        }
      }

      function updateTwoFinger(){
        if (!two.active) return;
        if (pointers.size < 2){ two.active = false; return; }

        const ids = Array.from(pointers.keys()).slice(0,2);
        const p0 = pointers.get(ids[0]);
        const p1 = pointers.get(ids[1]);

        const cx = (p0.x + p1.x) * 0.5;
        const cy = (p0.y + p1.y) * 0.5;

        const d = Math.max(10, dist2(p0,p1));
        const ang = ang2(p0,p1);

        const scale = d / two.lastDist;
        zoomFactor *= scale;
        clampZoom();
        applyScale();

        const dx = cx - two.lastCx;
        const dy = cy - two.lastCy;

        const { camDir, camRight, camUp } = getCamAxes();

        const speedXY = 0.0062;
        rotateCubeWorld(camUp,   dx * speedXY);
        rotateCubeWorld(camRight, dy * speedXY);

        const dAng = normalizeAngle(ang - two.lastAng);
        rotateCubeWorld(camDir, dAng);

        two.lastCx = cx;
        two.lastCy = cy;
        two.lastDist = d;
        two.lastAng = ang;
      }

      /* One finger: if on cube => slice turn. If empty space => rotate cube like two-finger drag (no zoom/roll). */
      const touchState = {
        mode: "none",     // none | slice | orbit1
        down:false,
        start:new THREE.Vector2(),
        last:new THREE.Vector2(),
        hit:null,
        decided:false,
        turnDir2D:null,
        orbitLastX:0,
        orbitLastY:0,
        orbitPointerId:null
      };

      function startOrbit1(e){
        touchState.mode = "orbit1";
        touchState.down = true;
        touchState.orbitPointerId = e.pointerId;
        touchState.orbitLastX = e.clientX;
        touchState.orbitLastY = e.clientY;
      }

      function orbit1Move(e){
        if (touchState.mode !== "orbit1") return;
        if (touchState.orbitPointerId !== e.pointerId) return;

        const dx = e.clientX - touchState.orbitLastX;
        const dy = e.clientY - touchState.orbitLastY;
        touchState.orbitLastX = e.clientX;
        touchState.orbitLastY = e.clientY;

        const { camRight, camUp } = getCamAxes();
        const speedXY = 0.0062;

        rotateCubeWorld(camUp,   dx * speedXY);
        rotateCubeWorld(camRight, dy * speedXY);
      }

      function endOrbit1(){
        if (touchState.mode !== "orbit1") return;
        touchState.mode = "none";
        touchState.down = false;
        touchState.orbitPointerId = null;
      }

      function onCanvasPointerDown(e){
        pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
        try{ renderer.domElement.setPointerCapture(e.pointerId); } catch {}

        if (pointers.size === 2){
          startTwoFinger();
          endOrbit1();
          return;
        }

        const hit = pick(e);

        if (!hit){
          startOrbit1(e);
          return;
        }

        if (autoMode || busy) return;

        touchState.mode = "slice";
        touchState.down = true;
        touchState.start.set(e.clientX, e.clientY);
        touchState.last.set(e.clientX, e.clientY);
        touchState.hit = hit;
        touchState.decided = false;
        touchState.turnDir2D = null;
      }

      function onCanvasPointerMove(e){
        if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });

        if (pointers.size >= 2){
          if (!two.active) startTwoFinger();
          updateTwoFinger();
          return;
        } else {
          two.active = false;
        }

        if (touchState.mode === "orbit1"){
          orbit1Move(e);
          return;
        }

        if (!touchState.down) return;
        if (touchState.mode !== "slice") return;
        if (autoMode || busy) return;

        const cur = new THREE.Vector2(e.clientX, e.clientY);
        const dragFromStart = cur.clone().sub(touchState.start);
        const distPx = dragFromStart.length();

        if (!touchState.decided){
          if (distPx < 8) return;

          const chosen = chooseBestTurnForDrag(touchState.hit, dragFromStart);
          if (!chosen) return;

          touchState.decided = true;
          touchState.turnDir2D = chosen.dir2D;

          pendingRecord = { axis: chosen.axis, layer: chosen.layer };
          startDragTurn(chosen.axis, chosen.layer);
          touchState.last.copy(cur);
        } else {
          if (!activeTurn) return;
          const delta = cur.clone().sub(touchState.last);
          touchState.last.copy(cur);

          const pixelsAlong = delta.dot(touchState.turnDir2D);
          const deltaAngle = (pixelsAlong / 140) * (Math.PI / 2);
          applyTurnDelta(deltaAngle);
        }
      }

      async function onCanvasPointerUp(e){
        pointers.delete(e.pointerId);

        if (pointers.size < 2){
          two.active = false;
        } else if (pointers.size >= 2){
          startTwoFinger();
        }

        if (touchState.mode === "orbit1" && touchState.orbitPointerId === e.pointerId){
          endOrbit1();
        }

        if (!touchState.down) {
          try{ renderer.domElement.releasePointerCapture(e.pointerId); } catch {}
          return;
        }

        if (touchState.mode === "slice"){
          touchState.down = false;

          if (touchState.decided && activeTurn && !autoMode && !busy){
            let q = Math.round(activeTurn.currentAngle / (Math.PI/2));
            q = Math.max(-2, Math.min(2, q));
            await animateSnapTo(q * (Math.PI/2), 1);
            finalizeWithKnownLayer(q, true);
          }

          touchState.hit = null;
          touchState.decided = false;
          touchState.turnDir2D = null;
          pendingRecord = null;
          touchState.mode = "none";
        }

        try{ renderer.domElement.releasePointerCapture(e.pointerId); } catch {}
      }

      renderer.domElement.addEventListener("pointerdown", onCanvasPointerDown);
      renderer.domElement.addEventListener("pointermove", onCanvasPointerMove);
      renderer.domElement.addEventListener("pointerup", onCanvasPointerUp);
      renderer.domElement.addEventListener("pointercancel", onCanvasPointerUp);

      addEventListener("resize", () => {
        camera.aspect = innerWidth/innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
        updateFit();
      });

      function tick(){
        renderer.render(scene, camera);
        requestAnimationFrame(tick);
      }
      tick();
    })();
  </script>
</body>
</html>
